<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <!-- Unified Topbar Header Layout -->
    <div class="topbar">
        <!-- Left aligned: Official Brand Logo & Title -->
        <div class="topbar-left">
            <div class="topbar-logo-wrap">
                <h:graphicImage name="images/gsis_logo.png" alt="GSIS Logo" styleClass="topbar-logo" />
                <div class="topbar-title">
                    <h2>Σύστημα Διαχείρισης Αδειών</h2>
                </div>
            </div>
        </div>
        
        <div class="topbar-right">
            
            <!-- Rendered for authenticated users -->
            <h:panelGroup rendered="#{not empty loginController.loggedInUser}">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="topbar-badge">
                        <i class="pi pi-shield" style="margin-right:6px;"></i>
                        <h:outputText value="Διαχειριστής" rendered="#{loginController.loggedInUserRole.toUpperCase() eq 'MANAGER'}" />
                        <h:outputText value="Γραμματεία" rendered="#{loginController.loggedInUserRole.toUpperCase() eq 'SECRETARY'}" />
                        <h:outputText value="Υπάλληλος" rendered="#{loginController.loggedInUserRole.toUpperCase() eq 'EMPLOYEE'}" />
                    </span>
                    
                    <span class="topbar-user">
                        <i class="pi pi-user" style="margin-right:6px;"></i>
                        #{loginController.loggedInUser.firstName} #{loginController.loggedInUser.lastName}
                    </span>

                    <!-- Quick Logout Action icon button -->
                    <h:form id="topLogoutForm" style="margin: 0; display: inline-block;">
                        <p:commandLink action="#{loginController.logout}" styleClass="topbar-logout-link" title="Αποσύνδεση">
                            <i class="pi pi-sign-out"></i>
                        </p:commandLink>
                    </h:form>
                    
                    <!-- Sidebar Hamburger menu toggle -->
                    <button type="button" class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar" title="Μενού">
                        <i class="pi pi-bars"></i>
                    </button>
                </div>
            </h:panelGroup>

            <!-- Rendered for guests (Login/Register Navigation Links) -->
            <h:panelGroup rendered="#{empty loginController.loggedInUser}">
                <div class="topbar-nav-links">
                    <h:outputLink value="#{request.contextPath}/login.xhtml"
                                  styleClass="topbar-nav-link #{request.servletPath.contains('login') ? 'active' : ''}">
                        <i class="pi pi-sign-in"></i>
                        <span>ΣΥΝΔΕΣΗ</span>
                    </h:outputLink>

                    <h:outputLink value="#{request.contextPath}/register.xhtml"
                                  styleClass="topbar-nav-link #{request.servletPath.contains('register') ? 'active' : ''}">
                        <i class="pi pi-user-plus"></i>
                        <span>ΕΓΓΡΑΦΗ</span>
                    </h:outputLink>
                </div>
            </h:panelGroup>

        </div>
    </div>

</ui:composition>
